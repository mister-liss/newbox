<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>newbox</title>
<style>
  :root { --bg:#fff; --fg:#111; --mut:#666; --line:#ddd; --code:#f4f4f4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --mut:#999; --line:#333; --code:#1c1c1c; }
  }
  html { background: var(--bg); }
  body { color: var(--fg); font: 16px/1.6 system-ui, sans-serif;
         max-width: 46rem; margin: 0 auto; padding: 3rem 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 2rem; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
       color: var(--mut); margin: 2rem 0 .5rem; font-weight: 600; }
  .row { display: flex; gap: .5rem; align-items: stretch; }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px;
        padding: .9rem 1rem; overflow-x: auto; font-size: .875rem; margin: 0; flex: 1; }
  code { font-family: ui-monospace, Consolas, monospace; }
  button { background: var(--code); color: var(--fg); border: 1px solid var(--line);
           border-radius: 6px; padding: 0 .9rem; font: inherit; font-size: .8rem;
           cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--mut); }
</style>

<h1>newbox</h1>

<h2>Windows</h2>
<div class="row">
  <pre><code>curl.exe -fsSL https://newbox.stevenmliss.com/newbox.ps1 | iex</code></pre>
  <button type="button">copy</button>
</div>

<h2>Linux</h2>
<div class="row">
  <pre><code>curl -fsSL https://newbox.stevenmliss.com/newbox.sh | sh</code></pre>
  <button type="button">copy</button>
</div>

<script>
  document.querySelectorAll('.row').forEach(function (row) {
    var btn = row.querySelector('button');
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(row.querySelector('code').textContent).then(function () {
        btn.textContent = 'copied';
        setTimeout(function () { btn.textContent = 'copy'; }, 1200);
      });
    });
  });
</script>
