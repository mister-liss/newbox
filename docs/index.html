<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>newbox</title>
<style>
  :root { --bg:#fff; --fg:#111; --mut:#666; --line:#ddd; --code:#f4f4f4; --hov:#e8e8e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --mut:#999; --line:#333; --code:#1c1c1c; --hov:#2a2a2a; }
  }
  html { background: var(--bg); }
  body { color: var(--fg); font: 16px/1.6 system-ui, sans-serif;
         max-width: 46rem; margin: 0 auto; padding: 3rem 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 2rem; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
       color: var(--mut); margin: 2rem 0 .5rem; font-weight: 600; }
  .row { position: relative; }
  pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px;
        padding: .9rem 3.25rem .9rem 1rem; overflow-x: auto; font-size: .875rem; margin: 0; }
  code { font-family: ui-monospace, Consolas, monospace; }
  .copy { position: absolute; top: .5rem; right: .5rem; width: 2rem; height: 2rem;
          display: grid; place-items: center; background: transparent; color: var(--mut);
          border: 1px solid transparent; border-radius: 6px; cursor: pointer; padding: 0; }
  .copy:hover { background: var(--hov); border-color: var(--line); color: var(--fg); }
  .copy svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor;
              stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .copy .tick { display: none; }
  .copy.done .tick { display: block; }
  .copy.done .clip { display: none; }
  .copy.done { color: #2da44e; }
</style>

<h1>newbox</h1>

<h2>Windows</h2>
<div class="row">
  <pre><code>curl.exe -fsSL https://newbox.stevenmliss.com/newbox.ps1 | iex</code></pre>
  <button class="copy" type="button" aria-label="Copy">
    <svg class="clip" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    <svg class="tick" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
  </button>
</div>

<h2>Linux</h2>
<div class="row">
  <pre><code>curl -fsSL https://newbox.stevenmliss.com/newbox.sh | sh</code></pre>
  <button class="copy" type="button" aria-label="Copy">
    <svg class="clip" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    <svg class="tick" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
  </button>
</div>

<script>
  document.querySelectorAll('.row').forEach(function (row) {
    var btn = row.querySelector('.copy');
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(row.querySelector('code').textContent).then(function () {
        btn.classList.add('done');
        btn.setAttribute('aria-label', 'Copied');
        setTimeout(function () {
          btn.classList.remove('done');
          btn.setAttribute('aria-label', 'Copy');
        }, 1400);
      });
    });
  });
</script>
